
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 320 72"
     fill="none">

  <defs>
    <linearGradient id="globeGradient"
      x1="8" y1="5" x2="58" y2="60"
      gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

    <!-- Earth Globe -->
    <g stroke="url(#globeGradient)"
    stroke-width="3.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none">

    <!-- Outer Globe -->
    <circle cx="36" cy="36" r="27"/>

    <!-- Longitude -->
    <ellipse cx="36" cy="36"
            rx="12" ry="27"/>

    <!-- Latitude -->
    <path d="M10 36H62"/>
    <path d="M15 22C28 27 44 27 57 22"/>
    <path d="M15 50C28 45 44 45 57 50"/>

    </g>

  <!-- Brand Name -->
    <text x="78" y="44"
        font-family="Inter, Arial, sans-serif"
        font-size="28"
        font-weight="800"
        letter-spacing="-1">

    <tspan fill="#172033">Sci</tspan><tspan fill="#2563EB">Verse</tspan>
    </text>

</svg>
